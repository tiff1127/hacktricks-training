name: "Get secrets"

# manual trigger
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this?'
        required: false
        default: 'Manual test'

# Required to get the ID Token that will be used for OIDC
permissions:
  id-token: write
  contents: read # needed for private repos to checkout

jobs:
  aws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::620483490609:role/sts-lab-2-target
          role-session-name: OIDCSession

      - run: aws secretsmanager get-secret-value --secret-id arn:aws:secretsmanager:us-east-1:620483490609:secret:flag_sts_lab_2-LK2fvH
        shell: bash
